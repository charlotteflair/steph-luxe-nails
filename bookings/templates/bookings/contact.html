<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Steph Luxe Nails</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #F5EBDD;
            color: #3E2C23;
            text-align: center;
        }

        header {
            background: #6B4F3A;
            color: #FFF9F2;
            padding: 25px;
        }

        .content {
            max-width: 800px;
            margin: 60px auto;
            padding: 40px;

            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(62, 44, 35, 0.15);
        }

        .content h2 {
            color: #6B4F3A;
            font-size: 32px;
        }

        .contact-info {
            margin: 30px 0;
            line-height: 2;
            color: #5A3E2B;
        }

        .contact-info p {
            margin: 10px 0;
            font-size: 17px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #5A3E2B;
            color: #FFF9F2;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: #3E2C23;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #6B4F3A;
            color: #FFF9F2;                
        }
    </style>
</head>

<body>

    <header>

        <h2>Contact Us 📞</h2>

        <p>
            We'd love to hear from you. Get in touch with Steph Luxe Nails
